{{ define "main" }}
<section class="wrap">
  <header class="list-header">
    <h1>{{ .Title }}</h1>
    <p class="meta">{{ len .Pages }} yazı</p>
  </header>
  {{ $paginator := .Paginate .Pages 5 }}
  <div class="post-list">
    {{ range $paginator.Pages }}
      {{ partial "post-card.html" (dict "page" . "featured" false) }}
    {{ end }}
  </div>
  {{ partial "pagination.html" $paginator }}
</section>
{{ end }}
